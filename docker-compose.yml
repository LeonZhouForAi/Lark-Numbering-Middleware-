services:
  rag:
    build: .
    env_file:
      - .env
    ports:
      - "${RAG_HOST_PORT:-8010}:8000"
    volumes:
      - ./data:/app/data
      - ./documents:/app/documents:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  rag-events:
    build: .
    command: ["python", "-m", "feishu_rag.long_connection"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
